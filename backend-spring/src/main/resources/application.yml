spring:
  application:
    name: nova-studio-backend
  config:
    # Load infrastructure config from a git-ignored .env (KEY=VALUE properties).
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    # M0 spike uses the shared `postgres` DB with a dedicated `nova_spike` schema.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    default-schema: nova_spike
    create-schemas: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5s

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

nova:
  ws:
    path: /api/nova/ws
    heartbeat-interval-ms: ${NOVA_WS_HEARTBEAT_INTERVAL_MS:30000}
    pong-grace-ms: ${NOVA_WS_PONG_GRACE_MS:10000}
    max-heartbeat-misses: 2
    max-task-ids-per-message: 200
    max-subscriptions-per-socket: 500
