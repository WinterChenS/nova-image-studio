spring:
  application:
    name: nova-studio-backend
  config:
    # Load infrastructure config from a git-ignored .env (KEY=VALUE properties).
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    # M1: user-confirmed `nova` database (see WIN-10/WIN-11), Flyway-managed public schema.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nova}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    default-schema: public
    create-schemas: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5s

server:
  port: ${PORT:8080}
  shutdown: graceful
  # WIN-22 (Q2): raised to ≥21MB so 20MB asset uploads survive the proxy/body caps
  # (matches the Node backend's MAX_REQUEST_BODY_BYTES). Oversized bodies surface
  # as a 413 PAYLOAD_TOO_LARGE via GlobalExceptionHandler.
  max-http-request-size: 21MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

nova:
  ws:
    path: /api/nova/ws
    heartbeat-interval-ms: ${NOVA_WS_HEARTBEAT_INTERVAL_MS:30000}
    pong-grace-ms: ${NOVA_WS_PONG_GRACE_MS:10000}
    max-heartbeat-misses: 2
    max-task-ids-per-message: 200
    max-subscriptions-per-socket: 500
    queue-broadcast-throttle-ms: 200
  task:
    # Hard ceiling matched to the Node backend's GLOBAL_TASK_CONCURRENCY.
    global-concurrency: 50
    ttl-ms: ${NOVA_TASK_TTL_MS:43200000}
    cleanup-interval-ms: ${NOVA_TASK_CLEANUP_INTERVAL_MS:300000}
    request-timeout-ms: ${NOVA_REQUEST_TIMEOUT_MS:1800000}
    ack-grace-ms: ${NOVA_TASK_ACK_GRACE_MS:120000}
    image-stream-enabled: ${NOVA_IMAGE_STREAM:true}
    image-stream-partial-images: ${NOVA_IMAGE_PARTIAL_IMAGES:1}
  storage:
    image-dir: ${NOVA_IMAGE_DIR:./data/nova-images}
    static-dir: ${NOVA_STATIC_DIR:../frontend/out}
    prompts-path: ${NOVA_PROMPTS_PATH:../backend/prompts.json}
    blacklist-path: ${NOVA_BLACKLIST_PATH:../backend/blacklist.json}
    # WIN-22 (N-7): single-asset upload ceiling (business limit, default 20MB)
    max-upload-bytes: ${NOVA_MAX_UPLOAD_BYTES:20971520}
  env-file: ${NOVA_ENV_FILE:.env}
