name: Build & Release (multi-arch)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      upload_release:
        description: "Upload to GitHub Releases"
        type: boolean
        default: false

permissions:
  contents: write

env:
  IMAGE_NAME: nova-image-studio

jobs:
  # T3.5 (WIN-13) 安全门禁：.env 变体不得入库；构建产物不得含 Key 明文
  # （PRD §7 安全验收 / ARCH B.7）。独立 job，PR/push 均强制。
  security-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .env 变体必须被 gitignore（git check-ignore 实测）
        run: |
          for f in .env .env.production .env.docker .env.local .env.docker.local \
                   backend/.env.production backend-spring/.env.production; do
            if git check-ignore -q "$f"; then
              echo "OK   $f ignored"
            else
              echo "FAIL $f 未被 gitignore 忽略"; exit 1
            fi
          done
          # 示例文件必须保留可提交
          if git check-ignore -q .env.example; then
            echo "FAIL .env.example 不应被忽略（白名单放行）"; exit 1
          fi
          echo "git check-ignore 断言通过"

      - name: 构建产物 grep 无 Key 明文（设置/模型路由未泄漏）
        run: |
          mkdir -p /tmp/leak-check
          printf 'sk-0123456789abcdefghijklmnopqrstuvwxyz\nBearer eyJhbGciOiJIUzI1NiJ9.abc.def\n' > /tmp/leak-check/.env.sample
          # 禁止任何 .env 文件进入工作区（除白名单示例）
          tracked_env=$(git ls-files | grep -E '(^|/)\.env($|\.)' || true)
          if [ -n "$tracked_env" ]; then
            echo "FAIL 有 .env 变体被提交:"; echo "$tracked_env"; exit 1
          fi
          echo "git ls-files 无 .env 变体"

  build:
    needs: security-gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ matrix.arch }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image to tar (${{ matrix.arch }})
        run: |
          docker save ${{ env.IMAGE_NAME }}:${{ matrix.arch }}-${{ github.sha }} \
            -o ${{ env.IMAGE_NAME }}-${{ matrix.arch }}-${{ github.sha }}.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-${{ matrix.arch }}-${{ github.sha }}.tar
          path: ${{ env.IMAGE_NAME }}-${{ matrix.arch }}-${{ github.sha }}.tar
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_release == 'true')
    steps:
      - name: Download all image artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.IMAGE_NAME }}-*-${{ github.sha }}.tar
          path: images
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            images/${{ env.IMAGE_NAME }}-amd64-${{ github.sha }}.tar
            images/${{ env.IMAGE_NAME }}-arm64-${{ github.sha }}.tar
