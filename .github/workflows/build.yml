name: Build & Release (multi-arch)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      upload_release:
        description: "Upload to GitHub Releases"
        type: boolean
        default: false

permissions:
  contents: write

env:
  IMAGE_NAME: nova-image-studio

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image ($${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/$${{ matrix.arch }}
          push: false
          load: true
          tags: $${{ env.IMAGE_NAME }}:$${{ matrix.arch }}-$${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image to tar ($${{ matrix.arch }})
        run: |
          docker save $${{ env.IMAGE_NAME }}:$${{ matrix.arch }}-$${{ github.sha }}             -o $${{ env.IMAGE_NAME }}-$${{ matrix.arch }}-$${{ github.sha }}.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: $${{ env.IMAGE_NAME }}-$${{ matrix.arch }}-$${{ github.sha }}.tar
          path: $${{ env.IMAGE_NAME }}-$${{ matrix.arch }}-$${{ github.sha }}.tar
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_release == 'true')
    steps:
      - name: Download all image artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: $${{ env.IMAGE_NAME }}-*-$${{ github.sha }}.tar
          path: images
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: $${{ github.ref_name }}
          name: "Release $${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            images/$${{ env.IMAGE_NAME }}-amd64-$${{ github.sha }}.tar
            images/$${{ env.IMAGE_NAME }}-arm64-$${{ github.sha }}.tar
