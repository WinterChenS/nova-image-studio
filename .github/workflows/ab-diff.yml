name: A/B Diff Regression (Spring vs Node)

# M1 A/B 差异回归（WIN-11 T1.11 / WIN-14 闭环）：
# 同一 frontend/out 对接 Node(3000) 与 Spring(8080)，对 12 条清单 P0 项做逐字段比对
# （mock 上游，无需真实 AI Key）。依赖双后端 + mock 上游，无法并入常规构建流水线。
#
# 触发方式：默认仅 workflow_dispatch（手动）——避免在真实 GitHub runner 上验证前
# 阻塞 PR 门禁。本地等价命令：bash backend-spring/scripts/run-ab-diff.sh（已实测 37/37）。
# WIN-17 (M1 遗留 1 闭环)：已固化 pull_request 门禁——后端相关改动（Spring/Node/探针/工作流）
# 自动触发 A/B 回归，防止 Q1 契约或任务链路回归；前端改动由 build.yml 独立门禁覆盖。
on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
    paths:
      - 'backend-spring/**'
      - 'backend/**'
      - '.github/workflows/ab-diff.yml'

jobs:
  ab-diff:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nova
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nova" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: nova
      DB_PASSWORD: nova
      DB_NAME: nova
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      # M2 (WIN-12): Spring 启动必需 — JWT 签名密钥 + AES-GCM 主密钥（CI 测试值）
      NOVA_JWT_SECRET: ci-jwt-secret-ci-jwt-secret-ci-jwt-secret-123456
      # S1-R (WIN-12 复审): 必须为合法 16/24/32 字节 base64（旧值解码 31 字节导致 Spring 启动失败）
      NOVA_SETTINGS_SECRET_KEY: Y2ktYWItZGlmZi1zZWNyZXQta2V5LTMyYnl0ZXMteHg=
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: "Install JS deps (root + frontend + backend)"
        run: |
          npm ci
          cd frontend && npm ci
          cd ../backend && npm ci

      - name: Build frontend static export (frontend/out)
        run: npm run build

      - name: Build Spring backend jar
        working-directory: backend-spring
        run: mvn -B -ntp -DskipTests package

      - name: Start Node backend (3000)
        working-directory: backend
        run: |
          PORT=3000 NODE_ENV=production node server.js > /tmp/node.log 2>&1 &
          echo "NODE_PID=$!" >> "$GITHUB_ENV"

      - name: Start Spring backend (8080)
        working-directory: backend-spring
        run: |
          java -jar target/nova-studio-backend-0.1.0-SNAPSHOT.jar > /tmp/spring.log 2>&1 &
          echo "SPRING_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for both backends
        run: |
          ok() { curl -sf -o /dev/null "$1"; }
          for i in $(seq 1 90); do ok http://localhost:3000/api/nova/config && break; sleep 1; done
          ok http://localhost:3000/api/nova/config || { echo "NODE NOT READY"; tail -50 /tmp/node.log; exit 1; }
          for i in $(seq 1 90); do ok http://localhost:8080/api/nova/config && break; sleep 1; done
          ok http://localhost:8080/api/nova/config || { echo "SPRING NOT READY"; tail -80 /tmp/spring.log; exit 1; }

      # WIN-28 (ADR-32 账号池): 双栈下 proxy/tasks 探针需要 Spring 侧目录模型 + 账号
      # （AbDiffSeed 独立 main 直接写 PG，幂等）；模型 ID 经 env 传给 ab-diff 脚本。
      # 必须在 Spring 就绪后运行（V5/V6 表已由 Flyway 建好）。
      - name: Seed ab-diff catalog + account
        working-directory: backend-spring
        run: |
          mvn -B -ntp -q compile dependency:build-classpath -Dmdep.outputFile=target/abdiff-cp.txt
          ABDIFF_IDS="$(java -cp \"target/classes:$(cat target/abdiff-cp.txt)\" com.nova.studio.integration.AbDiffSeed)"
          echo "ABDIFF_CATALOG_MODEL_ID=${ABDIFF_IDS%%,*}" >> "$GITHUB_ENV"
          echo "ABDIFF_TEXT_CATALOG_MODEL_ID=${ABDIFF_IDS##*,}" >> "$GITHUB_ENV"

      - name: Run A/B diff (37 probes)
        run: node backend-spring/scripts/ab-diff/ab-diff.mjs --node http://localhost:3000 --spring http://localhost:8080

      - name: Stop backends
        if: always()
        run: |
          kill "$NODE_PID" "$SPRING_PID" 2>/dev/null || true
